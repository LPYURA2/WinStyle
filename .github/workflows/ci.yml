name: WinStyle CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang lld gcc
      - name: Regression and fuzz
        run: sh run.sh
      - name: Sanitizers (documented Clang function exception)
        run: sh run_sanitizers.sh
